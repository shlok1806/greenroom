# The only place the -tags tart suite can run. Apple's Virtualization.framework
# offers nested virtualization on M3 and M4 alone, and only for Linux guests,
# so a hosted runner can never boot the macOS guests greenroom is made of.
#
# GitHub's own paths filter decides when this runs. A third-party filter action
# would need API permissions this workflow has no other reason to hold.
name: VM suite (self-hosted Mac)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/daemon/internal/machine/**"
      - "apps/daemon/internal/tart/**"
      - "apps/daemon/internal/testsupport/**"
      - "apps/daemon/e2e*_test.go"
      - "apps/daemon/scripts/build-image.sh"
      - ".github/workflows/vm-suite.yml"

jobs:
  vm:
    name: VM suite (tart)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    concurrency:
      group: vm-suite
      cancel-in-progress: false
    env:
      TART_STATE_DIR: /tmp/greenroom-vm-suite-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Other runs and the maintainer's own machines share this host, so their
      # guests come and go. Wait for a slot instead of failing on a snapshot.
      - name: Preflight - wait for Tart capacity and record existing VMs
        run: |
          set -euo pipefail
          if ! command -v tart >/dev/null 2>&1; then
            echo "::error::tart is not on PATH on this self-hosted runner."
            exit 1
          fi
          mkdir -p "$TART_STATE_DIR"
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            tart list --format json > "$TART_STATE_DIR/before.json"
            if python3 -c '
          import json, os, sys
          path = os.environ["TART_STATE_DIR"]
          with open(os.path.join(path, "before.json")) as f:
              vms = json.load(f)
          names = [v.get("Name", "") for v in vms]
          running = [v.get("Name", "") for v in vms if str(v.get("State", "")).lower() == "running"]
          with open(os.path.join(path, "names-before.txt"), "w") as f:
              f.write("\n".join(names))
          with open(os.path.join(path, "running.txt"), "w") as f:
              f.write(", ".join(running))
          if len(running) >= 2:
              sys.exit(1)
          print("Tart capacity OK. Running guest(s) before this job: " + (", ".join(running) if running else "(none)"))
          '; then
              break
            fi
            running="$(cat "$TART_STATE_DIR/running.txt")"
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Two macOS guests have been running under Tart for 15 minutes (Apple allows only two on one host at a time): $running. Free a slot before re-running this workflow."
              exit 1
            fi
            echo "Two macOS guests are running ($running); waiting for a free slot."
            sleep 15
          done

      # The image name carries the helper version, so bumping inputHelperVersion
      # bakes a fresh image here instead of silently testing a stale one.
      - name: Prepare greenroom-base for this input helper version
        working-directory: apps/daemon
        run: |
          set -euo pipefail
          version="$(grep -oE 'inputHelperVersion[[:space:]]*=[[:space:]]*[0-9]+' internal/machine/input.go | grep -oE '[0-9]+$')"
          if [ -z "$version" ]; then
            echo "::error::Could not parse inputHelperVersion out of internal/machine/input.go."
            exit 1
          fi
          image="greenroom-base-v$version"
          echo "Daemon expects input helper version $version: using $image"
          if tart list --source local --quiet | grep -qx "$image"; then
            echo "$image already exists."
          else
            echo "$image not found; building it with scripts/build-image.sh."
            scripts/build-image.sh -name "$image"
          fi
          for stale in $(tart list --source local --quiet | grep -E '^greenroom-base-v[0-9]+$' | grep -vx "$image" || true); do
            echo "Deleting $stale, baked for another helper version."
            tart delete "$stale" || echo "::warning::Failed to delete $stale"
          done
          echo "GREENROOM_BASE_IMAGE=$image" >> "$GITHUB_ENV"

      - name: go test -tags tart (full suite)
        working-directory: apps/daemon
        run: go test -tags tart -timeout 20m ./...

      - name: Cleanup - delete VMs this job created
        if: always()
        run: |
          set -uo pipefail
          if ! command -v tart >/dev/null 2>&1; then
            echo "tart is not on PATH; nothing to clean up."
            exit 0
          fi
          before_file="$TART_STATE_DIR/before.json"
          if [ ! -f "$before_file" ]; then
            echo "No 'before' VM snapshot found (preflight did not get that far); skipping cleanup rather than risk deleting a VM this job did not create."
            exit 0
          fi
          tart list --format json > "$TART_STATE_DIR/after.json"
          python3 -c '
          import json, os, subprocess
          path = os.environ["TART_STATE_DIR"]
          with open(os.path.join(path, "before.json")) as f:
              before_names = {v.get("Name", "") for v in json.load(f)}
          with open(os.path.join(path, "after.json")) as f:
              after_names = [v.get("Name", "") for v in json.load(f)]
          created = [n for n in after_names if n and n not in before_names]
          to_delete = [n for n in created if n.startswith("greenroom-") and not n.startswith("greenroom-base")]
          if not to_delete:
              print("No VMs created by this job need cleanup.")
          for name in to_delete:
              print("Deleting VM created by this job: " + name)
              result = subprocess.run(["tart", "delete", name], capture_output=True, text=True)
              if result.returncode != 0:
                  print("::warning::Failed to delete " + name + ": " + result.stderr.strip())
          '
          rm -rf "$TART_STATE_DIR"
